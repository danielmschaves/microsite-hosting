name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `--if-present` is deliberate: this repo does not have a `test`
      # script yet. Once one is added, this step starts running it
      # automatically — no workflow edit required.
      - name: Test
        run: npm test --if-present

      # CD-15 added argon2 (a native/compiled dependency, the first in this
      # repo) — ubuntu-latest above is glibc, so it can't catch an
      # Alpine/musl-specific native-module build failure. This step runs the
      # actual production image build to close that gap.
      - name: Docker build
        run: docker build -t microbuild-ci-check .
