# Full local stack — `docker compose up` runs the app with zero cloud
# dependencies. MinIO stands in for S3, local Postgres stands in for Neon.
# Provide OAuth credentials via a local `.env` file (docker compose loads it).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipsite
      POSTGRES_PASSWORD: shipsite
      POSTGRES_DB: shipsite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipsite"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-secret-change-me}
      AUTH_TRUST_HOST: "true"
      # Dev-only email login so you can sign in without OAuth apps. Set to
      # "false" (or remove) to require real Google/GitHub sign-in.
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      DATABASE_URL: postgres://shipsite:shipsite@postgres:5432/shipsite
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: shipsite
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-dev-insecure-cron-secret}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
